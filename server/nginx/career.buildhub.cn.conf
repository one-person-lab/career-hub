# career.buildhub.cn —— 职业工作台（静态 dist + /api/coach 反代）
# 装到 smzs-server:/www/server/panel/vhost/nginx/career.buildhub.cn.conf
#
# 站点按「知道域名才访问」的定位不设 basic auth，所以：
#   - 全站 X-Robots-Tag noindex，不进搜索引擎
#   - /api/coach 只转到本机 8790，按 IP 的调用配额在 coach-proxy.mjs 里做
server {
    listen 80;
    server_name career.buildhub.cn;
    root /www/wwwroot/career.buildhub.cn;
    location ^~ /.well-known/acme-challenge/ {
        allow all;
    }
    location / {
        return 301 https://$host$request_uri;
    }
    access_log /www/wwwlogs/career.buildhub.cn.log;
    error_log /www/wwwlogs/career.buildhub.cn.error.log;
}

server {
    listen 443 ssl;
    http2 on;
    server_name career.buildhub.cn;
    root /www/wwwroot/career.buildhub.cn;
    index index.html;

    ssl_certificate /www/server/panel/vhost/cert/career.buildhub.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/career.buildhub.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|svg|png|jpg|jpeg|webp|woff2?)$ {
        expires 12h;
        access_log off;
    }

    # 面试教练：真实上游与 key 只在 /opt/career-hub/.env，不进前端产物
    location = /api/coach {
        proxy_pass http://127.0.0.1:8790/api/coach;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 1m;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }

    access_log /www/wwwlogs/career.buildhub.cn.log;
    error_log /www/wwwlogs/career.buildhub.cn.error.log;
}
